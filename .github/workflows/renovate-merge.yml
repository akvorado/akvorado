---
name: Merge approved Renovate PR
on:
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  enable:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'akvorado' &&
      github.event.issue.pull_request &&
      github.event.issue.user.login == 'renovate[bot]' &&
      github.event.comment.user.type == 'User' &&
      (startsWith(github.event.comment.body, '@akvorado-ci OK') ||
       startsWith(github.event.comment.body, '@akvorado-ci[bot] OK'))
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.AKVORADO_APP_ID }}
          private-key: ${{ secrets.AKVORADO_APP_KEY }}
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$LOGIN/permission" --jq .permission)
          if [ "$perm" != admin ]; then
            echo "::error::$LOGIN is not admin"
            exit 1
          fi
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --auto --rebase
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=rocket
