---
name: Set up git identity
description: >
  Get a token for the GitHub App and configure git to commit under its identity.
inputs:
  client-id:
    description: Client ID of the GitHub App
    required: true
  private-key:
    description: Private key of the GitHub App
    required: true
outputs:
  token:
    description: Installation access token for the GitHub App
    value: ${{ steps.app-token.outputs.token }}
  name:
    description: Name to commit under
    value: ${{ steps.git-config.outputs.name }}
  email:
    description: Email address to commit under
    value: ${{ steps.git-config.outputs.email }}
runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      id: app-token
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
    - shell: bash
      id: git-config
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        SLUG: ${{ steps.app-token.outputs.app-slug }}
      run: |
        name="${SLUG}[bot]"
        id=$(gh api "/users/${name}" --jq .id)
        email="${id}+${name}@users.noreply.github.com"
        git config --global user.name "$name"
        git config --global user.email "$email"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "email=$email" >> "$GITHUB_OUTPUT"
